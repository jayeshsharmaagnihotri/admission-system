<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Entry Form</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .form-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 2rem;
      width: 100%;
      max-width: 440px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
    }

    .form-label span {
      font-size: 12px;
      color: #aaa;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    input {
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: #888;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 1.5rem;
    }

    button {
      flex: 1;
      padding: 9px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
      background: #fff;
    }

    button:hover { background: #f0f0f0; }

    #msg {
      display: none;
      font-size: 13px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <p style="font-size:13px;color:#999;letter-spacing:0.07em;text-transform:uppercase;margin-bottom:1.5rem;">Student entry</p>

    <div class="form-group">
      <label class="form-label">Name</label>
      <input type="text" id="name" placeholder="Full name" />
    </div>

    <div class="form-group">
      <label class="form-label">Marks <span>/ 100</span></label>
      <input type="number" id="marks" placeholder="0 – 100" min="0" max="100" />
    </div>

    <div class="form-group">
      <label class="form-label">Entrance score <span>/ 100</span></label>
      <input type="number" id="entrance" placeholder="0 – 100" min="0" max="100" />
    </div>

    <div class="form-group">
      <label class="form-label">Extracurricular score <span>/ 100</span></label>
      <input type="number" id="extra" placeholder="0 – 100" min="0" max="100" />
    </div>

    <div class="btn-row">
      <button onclick="handleSubmit()">Submit</button>
      <button onclick="handleReset()">Reset</button>
    </div>

    <p id="msg"></p>
  </div>

  <script>
    function handleSubmit() {
      const fields = [
        { id: 'name',     label: 'Name' },
        { id: 'marks',    label: 'Marks' },
        { id: 'entrance', label: 'Entrance score' },
        { id: 'extra',    label: 'Extracurricular score' }
      ];

      for (const f of fields) {
        if (!document.getElementById(f.id).value.trim()) {
          showMsg(f.label + ' is required.', 'red');
          return;
        }
      }

      showMsg('Entry submitted successfully.', 'green');
    }

    function handleReset() {
      ['name', 'marks', 'entrance', 'extra'].forEach(id => {
        document.getElementById(id).value = '';
      });
      const msg = document.getElementById('msg');
      msg.style.display = 'none';
    }

    function showMsg(text, color) {
      const msg = document.getElementById('msg');
      msg.textContent = text;
      msg.style.color = color;
      msg.style.display = 'block';
    }
  </script>

</body>
</html>
